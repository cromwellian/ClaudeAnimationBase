<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P(doom) C64 demo</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; image-rendering: pixelated; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><button id="play">play / pause</button><input id="scrub" type="range" min="0" max="156.6" step="0.02" value="0"><span id="tt"></span></div>
  <audio id="au" src="assets/pdoom_sid_full.wav" preload="auto"></audio>
</main>
<script src="font.js"></script>
<script src="vic.js"></script>
<script src="beats.js"></script>
<script src="core64.js"></script>
<script src="ch1_lab.js"></script>
<script src="ch2_chorus1.js"></script>
<script src="ch3_takeoff.js"></script>
<script src="ch4_chorus2.js"></script>
<script src="ch5_obsolete.js"></script>
<script src="ch6_chorus3.js"></script>
<script src="ch7_scale.js"></script>
<script src="ch8_chorus4.js"></script>
<script src="ch9_finale.js"></script>
<script src="main64.js"></script>
</body>
</html>
